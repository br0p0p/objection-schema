name: Mutation testing

# Slower than the main tests (Stryker on the runtime code, plus the curated type
# mutants), so it runs on pull requests and on demand rather than on every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    name: Runtime (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  types:
    name: Type declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutations:types
