name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so reviewers can tell new code from pre-existing code (git log/blame).
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Headless runs end when the model's turn ends. Without this, the review launches
          # background subagents, says it's waiting for them and exits before posting anything.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: code-review@claude-code-plugins
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The model running the command has skipped its subagent steps and still posted
          # "No issues found. Checked for bugs and CLAUDE.md compliance."
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --disallowedTools ScheduleWakeup
            --append-system-prompt "Follow every step of the code-review command as written,
            including launching each subagent it asks for, in parallel where it says so. Do not
            review the diff yourself instead of running the review agents, and do not skip the
            validation step. If a step fails, say which one in the PR comment, and do not post
            the no-issues comment unless every step ran."
          display_report: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
